<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tambola</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#dde1e8;--acc:#27466e;--onacc:#fff;--soft:#e6ecf5;--ok:#2e7d5b}
@media(prefers-color-scheme:dark){:root{--bg:#11161d;--card:#1a212b;--ink:#e8ecf2;--mut:#98a2b3;--line:#2a3441;--acc:#8fb0e0;--onacc:#10171f;--soft:#243246;--ok:#5bb58c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:30px;margin:18px 0 4px;letter-spacing:-.02em}h2{font-size:22px;margin:14px 0 10px}h3{font-size:15px;margin:0 0 10px}
.m,p{color:var(--mut);margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px}
label{display:block;font-weight:600;margin:8px 0 6px}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:70px;margin:8px 0;font-size:12px;word-break:break-all}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;margin:6px 6px 0 0}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.quiet{border-color:transparent;color:var(--mut)}.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
ul{list-style:none;margin:0;padding:0}li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}li:last-child{border:0}
.x{font:inherit;font-size:13px;color:var(--mut);background:none;border:0;cursor:pointer}
.qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:8px;margin:8px 0}.qr img,.qr canvas{max-width:100%;height:auto}
.cg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.cc{height:38px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}.cc.on{background:var(--acc);border-color:var(--acc)}
.top{display:flex;justify-content:space-between;color:var(--mut);margin:4px 2px 8px}
.cur{text-align:center}.big{font-size:84px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.bd{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:0 0 12px}
.bd i{font-style:normal;font-size:11px;text-align:center;padding:4px 0;border-radius:4px;background:var(--card);color:var(--mut);border:1px solid var(--line)}
.bd i.c{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.tk{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.tk td{height:40px;text-align:center;border-radius:6px;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;border:1px solid var(--line);cursor:pointer;user-select:none}
.tk td.e{background:var(--bg);border-color:transparent;cursor:default}
.tk td.m{background:var(--soft);color:var(--mut);text-decoration:line-through;text-decoration-thickness:2px;border-color:var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bar .btn{flex:1;max-width:260px;margin:0}
.w{color:var(--ok);font-weight:600;text-align:right}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));z-index:4;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.sheet li{padding:4px 0;border:0}.pk{display:flex;justify-content:space-between;width:100%;margin:0;text-align:left}
#ov{position:fixed;inset:0;background:rgba(10,14,20,.85);display:flex;align-items:center;justify-content:center;z-index:5}#ov[hidden],#t[hidden]{display:none}
#ov div{background:var(--card);padding:14px;border-radius:10px;width:min(92vw,420px)}#ov video{width:100%;border-radius:8px;background:#000}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:6;max-width:90vw;text-align:center}
</style></head><body>
<div id="app"></div><div id="ov" hidden></div><div id="t" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ROW=r=>[0,1,2,3,4].map(k=>[r,k]),ALL=[0,1,2].flatMap(ROW);
const PRE={'Early Five':{n:5},'Early Seven':{n:7},'Top line':{s:ROW(0)},'Middle line':{s:ROW(1)},'Bottom line':{s:ROW(2)},'Four corners':{s:[[0,0],[0,4],[2,0],[2,4]]},'Full house':{s:ALL}};
const DEF=['Early Five','Top line','Middle line','Bottom line','Four corners','Full house'];
let S={screen:'home',name:'',tk:[],marks:[],pz:[],called:[],cur:0,cu:new Set(),cn:'',paste:''},H={peers:{}},C={};

/* ---------- tickets & patterns ---------- */
function ticket(){for(;;){
  const c=Array(9).fill(1);for(let r=6;r;){const i=Math.random()*9|0;if(c[i]<3){c[i]++;r--}}
  const cnt=[0,0,0],rs=c.map(n=>{const s=sh([0,1,2]).slice(0,n).sort();s.forEach(x=>cnt[x]++);return s});
  if(cnt.some(x=>x!=5))continue;
  const t=[0,1,2].map(()=>Array(9).fill(0));
  rs.forEach((s,j)=>{const lo=j?j*10:1,hi=j==8?90:j*10+9,p=[];for(let x=lo;x<=hi;x++)p.push(x);
    const n=sh(p).slice(0,s.length).sort((a,b)=>a-b);s.forEach((r,q)=>t[r][j]=n[q])});
  return t}}
const slots=t=>t.map(r=>r.filter(x=>x));
function hit(p,t,ok){const sl=slots(t);return p.n?sl.flat().filter(x=>ok.has(x)).length>=p.n:p.s.every(([r,k])=>ok.has(sl[r][k]))}

/* ---------- room connection ---------- */
const SIG='wss://tambola-signal.a1265v.workers.dev/ws';
let W,me,hostId;C={q:[]};
const nm=id=>id=='H'?S.name:H.peers[id].name;
const plist=()=>[{id:'H',name:S.name},...Object.entries(H.peers).filter(([,p])=>p.up).map(([id,p])=>({id,name:p.name}))];
const toP=(id,m)=>{if(id=='H')recv(m);else{const p=H.peers[id];p&&p.up&&p.dc.readyState=='open'&&p.dc.send(JSON.stringify(m))}};
const toH=m=>S.role=='host'?hostRecv('H',m):C.dc&&C.dc.readyState=='open'&&C.dc.send(JSON.stringify(m));
const bcast=m=>plist().forEach(p=>toP(p.id,m));
const pz=()=>H.prizes.map(p=>({name:p.name,w:p.winners}));
const send=(to,d)=>W.send(JSON.stringify({to,d}));
function pushLobby(){bcast({k:'lobby',pl:plist().map(p=>p.name)});render()}
function uniq(n){const b=(n||'').trim()||'Player';let x=b,i=2;while(plist().some(p=>p.name==x))x=b+' '+i++;return x}
function connect(){
  if(SIG.includes('YOUR-WORKER')){S.screen='home';render();return toast('Set the SIG address at the top of the script first.')}
  W=new WebSocket(SIG);
  W.onopen=()=>{S.ping=setInterval(()=>W.readyState==1&&W.send('{}'),25000)};
  W.onmessage=e=>sig(JSON.parse(e.data));
  W.onclose=()=>{clearInterval(S.ping);if(S.screen=='wait'){S.screen='home';render()}toast('Couldn’t reach the room service. Check your connection and reload.')}}
function sig(m){
  if(m.t=='hello'){me=m.id;hostId=m.host;S.pl=[];S.screen='lobby';
    if(me==hostId){S.role='host';resetHost()}else S.role='guest';render()}
  if(m.t=='join'&&S.role=='host'&&!H.peers[m.id])addP(m.id);
  if(m.t=='leave'&&S.role=='host')drop(m.id);
  if(m.t=='sig')onSig(m.from,m.d);
  if(m.t=='host'){hostId=m.host;closeC();S.end=0;S.tk=[];
    if(m.host==me){clearTimeout(H.t);S.role='host';resetHost();S.screen='lobby';m.peers.forEach(addP)}
    else{S.role='guest';S.screen='lobby';S.pl=[]}
    render()}}
function addP(id){
  const pc=new RTCPeerConnection({iceServers:[]}),dc=pc.createDataChannel('t'),p=H.peers[id]={pc,dc,name:'',up:false,q:[]};
  pc.onicecandidate=e=>e.candidate&&send(id,{c:e.candidate});
  dc.onopen=()=>{if(H.run)dc.send(JSON.stringify({k:'busy'}))};
  dc.onmessage=e=>hostRecv(id,JSON.parse(e.data));dc.onclose=()=>drop(id);
  pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>send(id,{s:pc.localDescription}))}
async function onSig(from,d){
  try{
    if(S.role=='host'){const p=H.peers[from];if(!p)return;
      if(d.a){await p.pc.setRemoteDescription(d.a);p.q.forEach(c=>p.pc.addIceCandidate(c).catch(()=>{}));p.q=[]}
      if(d.c)p.pc.remoteDescription?p.pc.addIceCandidate(d.c).catch(()=>{}):p.q.push(d.c);return}
    if(d.s){closeC();const pc=C.pc=new RTCPeerConnection({iceServers:[]});
      pc.onicecandidate=e=>e.candidate&&send(from,{c:e.candidate});
      pc.ondatachannel=e=>{const dc=C.dc=e.channel;dc.onopen=()=>dc.send(JSON.stringify({k:'hi',n:S.name}));
        dc.onmessage=m=>recv(JSON.parse(m.data));dc.onclose=()=>{S.role=='guest'&&S.screen!='busy'&&toast('Disconnected from the owner')}};
      await pc.setRemoteDescription(d.s);await pc.setLocalDescription(await pc.createAnswer());send(from,{a:pc.localDescription});
      C.q.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));C.q=[]}
    else if(d.c)C.pc&&C.pc.remoteDescription?C.pc.addIceCandidate(d.c).catch(()=>{}):C.q.push(d.c)
  }catch(e){toast('Connection problem. Try reloading the page.')}}
function closeC(){C.pc&&C.pc.close();C.pc=C.dc=null}
function drop(id){const p=H.peers[id];if(!p||!p.up)return;p.up=false;toast(p.name+' left');if(H.run)chk();pushLobby()}

/* ---------- host game engine ---------- */
function startGame(){
  H.run=1;H.tk={};H.order=sh([...Array(90)].map((_,i)=>i+1));H.idx=-1;H.called=[];
  H.prizes.forEach(p=>{p.winners=[];p.at=-1});
  plist().forEach(p=>{H.tk[p.id]=Array.from({length:H.cards},ticket);toP(p.id,{k:'start',tk:H.tk[p.id],pz:pz()})});next()}
function next(){
  clearTimeout(H.t);
  if(H.idx>=89||(H.prizes.length&&H.prizes.every(p=>p.winners.length)))return endGame();
  H.idx++;const n=H.order[H.idx];H.called.push(n);H.done=new Set();
  bcast({k:'num',n,called:H.called,to:H.to});H.t=setTimeout(next,H.to*1000)}
function chk(){if(plist().every(p=>H.done.has(p.id))){clearTimeout(H.t);H.t=setTimeout(next,700)}}
function endGame(){H.run=0;bcast({k:'end',pz:pz()})}
function hostRecv(id,m){
  if(m.k=='hi'){const p=H.peers[id];if(p&&!H.run){p.name=uniq(m.n);p.up=true;pushLobby()}return}
  if(!H.run)return;
  if(m.k=='done'&&m.n==H.order[H.idx]){H.done.add(id);chk()}
  if(m.k=='claim'){
    const t=H.tk[id],p=H.prizes[m.pi],who=nm(id);if(!t||!p)return;let ok=false,why='';
    if(p.winners.includes(who))why='You already won this prize.';
    else if(p.winners.length&&p.at!=H.idx)why='This prize was already claimed.';
    else{const cl=new Set(H.called);
      ok=m.marks.some((mk,i)=>t[i]&&hit(p.pat,t[i],new Set(mk.filter(x=>cl.has(x)&&t[i].flat().includes(x)))));
      if(!ok)why='Not valid yet. Check the numbers you’ve crossed out.'}
    if(ok){p.winners.push(who);p.at=H.idx}
    toP(id,{k:'cres',ok,why,name:p.name});if(ok)bcast({k:'pz',pz:pz(),who,won:[p.name]})}}

/* ---------- player side ---------- */
function recv(m){
  if(m.k=='busy'){S.screen='busy';return render()}
  if(m.k=='lobby'){S.pl=m.pl;if(S.screen!='game')S.screen='lobby'}
  if(m.k=='start'){S.cl=0;S.tk=m.tk;S.marks=m.tk.map(()=>new Set());S.pz=m.pz;S.called=[];S.cur=0;S.end=0;S.done=false;S.dl=0;S.screen='game'}
  if(m.k=='num'){S.cur=m.n;S.called=m.called;S.done=false;S.dl=Date.now()+m.to*1000}
  if(m.k=='pz'){S.pz=m.pz;toast(m.who+' won '+m.won.join(', '))}
  if(m.k=='cres'){toast(m.ok?'Claim accepted: '+m.name:m.name+': '+m.why);if(m.ok)S.cl=0}
  if(m.k=='end'){S.end=1;S.cl=0;S.pz=m.pz;S.dl=0}
  render()}
function mk(i,n){const s=S.marks[i];s.has(n)?s.delete(n):s.add(n);render()}
function done(){if(S.done||S.end)return;S.done=true;toH({k:'done',n:S.cur});render()}
function claimPrize(i){toH({k:'claim',pi:i,marks:S.marks.map(s=>[...s])})}

/* ---------- lobby helpers ---------- */
function resetHost(){H={peers:{},cards:2,to:60,prizes:[],run:0};DEF.forEach(addPre);S.cu=new Set()}
function addPre(k){const c=H.prizes.filter(p=>p.base==k).length;H.prizes.push({name:c?k+' #'+(c+1):k,base:k,pat:PRE[k],winners:[],at:-1})}
function tg(x){S.cu.has(x)?S.cu.delete(x):S.cu.add(x);render()}
function customAdd(){if(!S.cu.size)return toast('Select at least one square');
  H.prizes.push({name:(S.cn||'').trim()||'Custom pattern',pat:{s:[...S.cu].map(x=>x.split(',').map(Number))},winners:[],at:-1});S.cu=new Set();S.cn='';render()}
function go(){if(!S.name.trim())return toast('Enter your name first');S.name=S.name.trim();S.screen='wait';render();connect()}

/* ---------- toast ---------- */
function toast(m){const t=$('#t');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,3500)}

/* ---------- views ---------- */
const vHome=()=>`<h1>Tambola</h1><p>Open this on the same wifi as everyone else. The first person in sets up the game.</p>
<div class="card"><label for="nm">Your name</label><input id="nm" value="${esc(S.name)}" maxlength="20" placeholder="Enter your name" oninput="S.name=this.value">
<button class="btn pri" style="width:100%;padding:12px;margin-top:12px" onclick="go()">Enter room</button></div>`;
const vWait=()=>`<h2>Finding your room…</h2><p>Looking for a game on your wifi.</p>`;
const vBusy=()=>`<h2>Game in progress</h2><p>The owner has already started. Open this page again when the game ends.</p>`;
function vLobby(){
  const host=S.role=='host',pl=host?plist().map(p=>p.name):(S.pl||[]);
  let x=`<h2>Lobby</h2>${host?'<p>Everyone on this wifi who opens the game joins automatically. You’re the owner, so set things up below.</p>':''}<div class="card"><h3>Players (${pl.length})</h3><ul>${pl.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
  if(!host)return x+`<p>${pl.length?'Waiting for the owner to start the game…':'Connecting to the owner…'}</p>`;
  x+=`<div class="card"><h3>Game settings</h3><div class="row"><div><label for="cp">Tickets per player</label><input id="cp" type="number" min="1" max="12" value="${H.cards}" onchange="H.cards=Math.max(1,Math.min(12,+this.value||1))"></div>
<div><label for="to">Max wait per number (seconds)</label><input id="to" type="number" min="10" max="300" value="${H.to}" onchange="H.to=Math.max(10,Math.min(300,+this.value||60))"></div></div></div>`;
  x+=`<div class="card"><h3>Prizes</h3><ul>${H.prizes.map((p,i)=>`<li><span>${esc(p.name)}</span><button class="x" onclick="H.prizes.splice(${i},1);render()">Remove</button></li>`).join('')||'<li>No prizes yet</li>'}</ul>
<label for="ps">Add a standard prize</label><div class="row"><select id="ps">${Object.keys(PRE).map(k=>`<option>${k}</option>`).join('')}</select><button class="btn" style="margin:0" onclick="addPre($('#ps').value);render()">Add</button></div>
<label>Custom pattern</label><p style="margin:0">Pick the numbers that must be crossed out. Each ticket row has 5 numbers, left to right.</p>
<div class="cg">${[0,1,2].map(r=>[0,1,2,3,4].map(k=>`<button class="cc ${S.cu.has(r+','+k)?'on':''}" aria-label="Row ${r+1}, number ${k+1}" onclick="tg('${r},${k}')"></button>`).join('')).join('')}</div>
<input placeholder="Pattern name" maxlength="30" value="${esc(S.cn||'')}" oninput="S.cn=this.value"><button class="btn" onclick="customAdd()">Add custom prize</button></div>`;
  return x+`<button class="btn pri" style="width:100%;padding:14px" onclick="startGame()">Start game</button>`}
function vGame(){
  const c=new Set(S.called);
  return `<div class="top"><span>Called ${S.called.length}/90</span><span id="cd"></span></div>
<div class="card cur"><div class="big">${S.end?'–':S.cur||'–'}</div>${S.end?'<p>Game over</p>':''}</div>
<div class="bd">${[...Array(90)].map((_,i)=>`<i class="${c.has(i+1)?'c':''}">${i+1}</i>`).join('')}</div>
${S.tk.map((t,i)=>`<div class="card"><h3>Ticket ${i+1}</h3><table class="tk">${t.map(r=>`<tr>${r.map(n=>n?`<td class="${S.marks[i].has(n)?'m':''}" onclick="mk(${i},${n})">${n}</td>`:'<td class="e"></td>').join('')}</tr>`).join('')}</table></div>`).join('')}
<div class="card"><h3>${S.end?'Results':'Prizes'}</h3><ul>${S.pz.map(p=>`<li><span>${esc(p.name)}</span><span class="${p.w.length?'w':''}">${p.w.length?esc(p.w.join(', ')):(S.end?'Unclaimed':'Open')}</span></li>`).join('')}</ul></div>
${S.end?'':`<div class="bar"><button class="btn pri" ${S.done?'disabled':''} onclick="done()">${S.done?'Waiting for others':'Done'}</button><button class="btn" onclick="S.cl=1;render()">Claim</button></div>`}${S.cl&&!S.end?vSheet():''}`}
const vSheet=()=>`<div class="sheet"><h3>Claim a prize</h3><p style="margin-top:0">Tap the prize you think you’ve completed. The game will check your crossed-out numbers.</p>
<ul>${S.pz.map((p,i)=>`<li><button class="btn pk" onclick="claimPrize(${i})"><span>${esc(p.name)}</span><span class="${p.w.length?'w':''}">${p.w.length?esc(p.w.join(', ')):'Open'}</span></button></li>`).join('')}</ul>
<button class="btn quiet" onclick="S.cl=0;render()">Close</button></div>`;
function render(){
  $('#app').innerHTML={home:vHome,wait:vWait,lobby:vLobby,game:vGame,busy:vBusy}[S.screen]()}
setInterval(()=>{const e=$('#cd');if(e)e.textContent=S.dl&&!S.end?'Next number in at most '+Math.max(0,Math.ceil((S.dl-Date.now())/1000))+'s':''},500);
render();
</script></body></html>
